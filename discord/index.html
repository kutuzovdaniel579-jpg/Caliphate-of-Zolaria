<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a destination</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing-page">
      <p class="eyebrow">WELCOME</p>
      <h1>Where would you like to go?</h1>
      <p class="description">Choose one of the destinations below to continue.</p>

      <nav class="options" aria-label="Destinations">
        <a class="option-card" href="/discord/rtc">
          <img class="option-icon" src="https://i.postimg.cc/25ssbXSH/rtc.png" alt="RTC server icon" />
          <span class="option-details">
            <span class="option-name">RTC</span>
            <span class="option-path">/rtc</span>
          </span>
          <span class="option-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="option-card" href="/discord/zola">
          <img class="option-icon" src="https://i.postimg.cc/zfssbPGx/zola.png" alt="ZOLA server icon" />
          <span class="option-details">
            <span class="option-name">ZOLA</span>
            <span class="option-path">/zola</span>
          </span>
          <span class="option-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
  </body>
</html>
