<!DOCTYPE html>
<html>
  <head>
    <title>Discord Widget</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="widget-card">
      <h1>Community members online</h1>
      <p>Live status from our Discord server</p>
      <iframe
        class="discord"
        src="https://discord.com/widget?id=1552728869407039609&amp;theme=dark"
        title="Discord server members and online status"
        width="350"
        height="500"
        allowtransparency="true"
        frameborder="0"
        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
      ></iframe>
    </main>
  </body>
  
</html>
